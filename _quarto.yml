project:
  type: website                      # was: book
  output-dir: docs
  pre-render: R/data.R

website:
  title: "Systematic Review of Acceptability Judgment Tasks in Theoretical Linguistics"
  site-url: https://jasongraf1.github.io/ajt_review/
  repo-url: https://github.com/jasongraf1/ajt_review
  repo-branch: main
  # repo-actions: [source, issue]    # optional: "View source" / "Report an issue" links
  page-navigation: true              # keeps the prev/next links you had in the book
  search: true
  # image: "_images/laptop_cat.jpg"  # optional: site-wide social-preview image
  # open-graph: true

  sidebar:
    style: docked
    title: "AJT Review"              # shorter label for the sidebar header; delete to use the full title
    search: true
    tools:
      - icon: github
        href: https://github.com/jasongraf1/ajt_review
    contents:
      - text: "Home"
        href: index.qmd
      - participants.qmd
      - section: "Design"
        contents:
          - design.qmd
          - stimuli.qmd
          - task.qmd
      - section: "Rigor"
        contents:
          - analysis.qmd
          - transparency.qmd
      - examples.qmd
      - references.qmd
      - text: "Checklist for authors"
        href: checklist.qmd
      - text: "Glossary"
        href: glossary.qmd

  page-footer:
    left: |
      Website and annotation app written by Jason Grafmiller.
    right: |
      This site was built with <a href="https://quarto.org/">Quarto</a>.

format:
  html:
    mainfont: 'Roboto'
    fontsize: 100%
    number-sections: false
    toc: true                        # books turn this on by default; websites don't
    toc-title: "AJT review"
    theme:
      light:
        - flatly
        - custom.scss
      dark:
        - darkly
        - custom_dark.scss
    css: custom_bib.css
    include-in-header: roboto_serif.html

execute:
  echo: false
  message: false
  warning: false
  freeze: auto
  fig-dpi: 300

editor: source
engine: knitr

#tbl-cap-location: top
#fig-cap-location: bottom
filters:
  - lightbox
lightbox: auto

knitr:
  opts_chunk:
    tidy: styler
    dev: "svglite"

bibliography: [articles_selected_final.bib, references.bib]
link-citations: true
csl: unified-style-linguistics.csl

# NOTE: `nocite: @*` has been removed from here and should go in the
# front matter of references.qmd only (see notes).
